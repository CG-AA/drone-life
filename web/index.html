<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e1116" />
  <title>drone life — sky view</title>
  <link rel="stylesheet" href="./src/shared/theme.css" />
  <link rel="stylesheet" href="./src/viewer/viewer.css" />
</head>
<body>
  <div id="hud">
    <div id="score-box">
      <span class="visually-hidden">team score</span>
      <div id="score" aria-live="polite">0</div>
      <div id="mission">connecting…</div>
      <div id="mstrip" hidden>
        <span id="ms-wave">WAVE 1</span>
        <span id="ms-phase"></span>
        <span id="ms-keep">
          <span class="ms-label">KEEP</span>
          <span id="keep-bar" role="meter" aria-label="keep hp"><span id="keep-fill"></span></span>
          <span id="ms-keep-hp"></span>
        </span>
        <span id="ms-towers"></span>
      </div>
    </div>
    <div id="banner" hidden></div>
    <div id="overlay" hidden></div>
    <div id="feed" role="log" aria-live="polite" aria-label="game events"></div>
    <div id="conn" role="status">offline</div>
    <div id="nav-hint">scroll to zoom · drag to pan · click a drone to follow · n next drone · 0 resets · double-click fullscreen</div>
    <div id="attract" class="hidden">
      <div class="attract-label">join the sky at</div>
      <div id="attract-url"></div>
      <div class="attract-label">room code</div>
      <div id="attract-code"></div>
    </div>
  </div>
  <div id="join-overlay" class="hidden">
    <form id="code-form">
      <h1>drone life — sky view</h1>
      <label class="visually-hidden" for="code-input">room code</label>
      <input id="code-input" placeholder="room code" autocomplete="off" autofocus />
      <div id="join-error"></div>
      <button type="submit">watch the sky</button>
    </form>
  </div>
  <script type="module" src="/src/viewer/main.ts"></script>
</body>
</html>
