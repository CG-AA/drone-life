<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e1116" />
  <title>drone life — fly your code</title>
  <link rel="stylesheet" href="./src/shared/theme.css" />
  <link rel="stylesheet" href="./src/submit/submit.css" />
</head>
<body>
  <div id="layout">
    <div id="editor-pane">
      <div id="toolbar">
        <div class="title">drone life — <span id="pilot-name">…</span></div>
        <span class="tb-pill" id="mission-pill" title="the game running right now">mission: …</span>
        <span class="tb-pill" id="score-pill" title="the whole room's score">team 0</span>
        <span class="tb-pill" id="me-pill" title="your own points and place on the board">you 0</span>
        <a class="tb-link" id="sky-link" href="./" target="_blank" rel="noopener"
           title="the projector view, in a new tab">sky view ↗</a>
        <label class="visually-hidden" for="template-select">load a starter template</label>
        <select id="template-select">
          <option value="" selected disabled>template…</option>
          <optgroup label="starters">
            <option value="beginner">beginner — first flight</option>
            <option value="delivery">delivery — carry crates</option>
            <option value="siege">siege — zap creeps</option>
            <option value="pymavlink">raw pymavlink</option>
          </optgroup>
          <optgroup label="demo bots (the instructor's bots)">
            <option value="bot_courier">courier bot (delivery)</option>
            <option value="bot_siege">zapper bot (siege)</option>
            <option value="bot_tower">tower-builder bot (siege)</option>
            <option value="bot_builder">builder bot (rampart)</option>
            <option value="bot_patrol">patrol bot (any)</option>
          </optgroup>
        </select>
        <button id="reset-btn" title="Stop the script and put your drone back on its pad">reset drone</button>
        <button id="stop-btn">stop</button>
        <button id="run-btn">▶ run</button>
      </div>
      <div id="banner" role="alert"></div>
      <div id="editor"></div>
      <div id="status-bar">
        <span class="pill" id="run-pill" role="status">idle</span>
        <span id="run-hint">edit the code, then press run — watch the sky view!</span>
      </div>
    </div>
    <div id="side-pane">
      <div class="side-title">your drone</div>
      <div id="drone-strip">
        <span>mode <b id="d-mode">—</b></span>
        <span>armed <b id="d-armed">—</b></span>
        <span id="d-link">link <b>—</b></span>
        <span>N <b id="d-n">—</b></span>
        <span>E <b id="d-e">—</b></span>
        <span>alt <b id="d-alt">—</b></span>
        <span id="d-carrying"></span>
        <span id="d-wallet"></span>
      </div>
      <div class="side-title">script output</div>
      <div id="log-pane" role="log" aria-label="script output"></div>
    </div>
  </div>
  <div id="join-overlay" class="hidden">
    <form id="join-form">
      <h1>drone life</h1>
      <p>Join the sky: pick a name, enter the room code from your instructor.</p>
      <!-- the small rooms behind the proxy, when the server lists any (docs/ROOMS.md) -->
      <p id="room-here" class="hidden"></p>
      <div id="room-list" class="hidden" role="list" aria-label="pick a room"></div>
      <label class="visually-hidden" for="join-name">your name</label>
      <input id="join-name" placeholder="your name" maxlength="24" autocomplete="off" />
      <label class="visually-hidden" for="join-code">room code</label>
      <input id="join-code" placeholder="room code" autocomplete="off" />
      <div id="join-error"></div>
      <button type="submit">claim my drone</button>
    </form>
  </div>
  <script type="module" src="/src/submit/main.ts"></script>
</body>
</html>
